# Streamlit 1.40 supports a single theme (no [theme.light]/[theme.dark]), so this
# matches the light palette of api/index.html. app/app.py injects the same tokens.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#eef2f7"
textColor = "#14202e"
font = "sans serif"

[server]
headless = true
