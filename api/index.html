<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Support Ops Intelligence AI - Instantly analyze customer support tickets for priority, resolution time, and satisfaction.">
    <title>Support Ops Intelligence | AI Predictor</title>
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-1: #8b5cf6;
            --accent-2: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 0.4rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            text-align: center;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin: 0;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .tab-btn:hover:not(.active) {
            color: white;
            background: rgba(255,255,255,0.1);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Submit Button */
        button.submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent-1));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button.submit-btn:hover {
            transform: scale(1.02);
            box-shadow: var(--glow);
        }

        button.submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result Alert */
        .result-alert {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            display: none;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            animation: pulse-border 2s infinite;
        }

        .result-alert.success { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
        .result-alert.warning { background: rgba(245, 158, 11, 0.1); border-color: var(--warning); color: var(--warning); }
        .result-alert.danger { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); }
        .result-alert.info { background: rgba(59, 130, 246, 0.1); border-color: var(--primary); color: var(--primary); }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255, 0.1); }
            70% { box-shadow: 0 0 0 10px rgba(255,255,255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <main class="glass-panel">
            <header>
                <h1>Support Ops AI</h1>
                <p class="subtitle">Cloud API Interface</p>
            </header>

            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('priority')">Priority Routing</button>
                <button class="tab-btn" onclick="showTab('sla')">SLA Prediction</button>
                <button class="tab-btn" onclick="showTab('satisfaction')">Satisfaction Insights</button>
            </div>

            <!-- PRIORITY TAB -->
            <div id="tab-priority" class="tab-content active">
                <form id="form-priority" onsubmit="handlePredict(event, 'predict_priority')">
                    <div class="form-group">
                        <label>Issue Description</label>
                        <textarea name="issue_description" required minlength="5">Login page is not loading on my laptop.</textarea>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Product</label>
                            <select name="product">
                                <option value="Web Portal">Web Portal</option>
                                <option value="Mobile App">Mobile App</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" name="category" value="Login Issue" required>
                        </div>
                        <div class="form-group">
                            <label>Channel</label>
                            <select name="channel">
                                <option value="Email">Email</option>
                                <option value="Live Chat">Live Chat</option>
                                <option value="Phone">Phone</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Subscription</label>
                            <select name="subscription_type">
                                <option value="Premium">Premium</option>
                                <option value="Free">Free</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="btn-priority">
                        <span>Predict Priority</span><div class="spinner"></div>
                    </button>
                    <div class="result-alert" id="res-priority"></div>
                </form>
            </div>

            <!-- SLA TAB -->
            <div id="tab-sla" class="tab-content">
                <form id="form-sla" onsubmit="handlePredict(event, 'predict_resolution_hours')">
                    <div class="form-group">
                        <label>Issue Description</label>
                        <textarea name="issue_description" required minlength="5">App crashes immediately after the latest update.</textarea>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" name="category" value="Bug Report" required>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select name="priority">
                                <option value="High">High</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>First Response (hrs)</label>
                            <input type="number" name="first_response_time_hours" value="2.5" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label>Complexity Score (1-10)</label>
                            <input type="number" name="issue_complexity_score" value="7" min="1" max="10" required>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="btn-sla">
                        <span>Estimate Resolution Time</span><div class="spinner"></div>
                    </button>
                    <div class="result-alert" id="res-sla"></div>
                </form>
            </div>

            <!-- SATISFACTION TAB -->
            <div id="tab-satisfaction" class="tab-content">
                <form id="form-satisfaction" onsubmit="handlePredict(event, 'predict_satisfaction')">
                    <div class="form-group">
                        <label>Issue Description</label>
                        <textarea name="issue_description" required minlength="5">The support agent was helpful but it took too long to reply.</textarea>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" name="category" value="General Inquiry" required>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select name="priority">
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Channel</label>
                            <select name="channel">
                                <option value="Email">Email</option>
                                <option value="Live Chat">Live Chat</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>First Response (hrs)</label>
                            <input type="number" name="first_response_time_hours" value="24.0" step="0.1" required>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="btn-satisfaction">
                        <span>Predict Satisfaction</span><div class="spinner"></div>
                    </button>
                    <div class="result-alert" id="res-satisfaction"></div>
                </form>
            </div>

        </main>
    </div>

    <script>
        // Tab Switching Logic
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Form Submission Logic
        async function handlePredict(e, endpoint) {
            e.preventDefault();
            
            const form = e.target;
            const btn = form.querySelector('.submit-btn');
            const spinner = form.querySelector('.spinner');
            
            // Map endpoint to tab ID
            const tabId = endpoint === 'predict_priority' ? 'priority' : 
                          endpoint === 'predict_resolution_hours' ? 'sla' : 'satisfaction';
            
            const resultBox = document.getElementById(`res-${tabId}`);
            
            // Reset state
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            resultBox.style.display = 'none';
            resultBox.className = 'result-alert';
            
            // Build JSON payload
            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());
            
            // Convert numbers
            if (payload.first_response_time_hours) payload.first_response_time_hours = parseFloat(payload.first_response_time_hours);
            if (payload.issue_complexity_score) payload.issue_complexity_score = parseInt(payload.issue_complexity_score);

            const baseUrl = window.location.origin;
            
            try {
                const response = await fetch(`${baseUrl}/${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("API request failed.");
                
                const data = await response.json();
                resultBox.style.display = 'block';

                if (endpoint === 'predict_priority') {
                    const p = data.predicted_priority;
                    resultBox.textContent = `Predicted Priority: ${p}`;
                    if(p === 'Urgent') resultBox.classList.add('danger');
                    else if(p === 'High') resultBox.classList.add('warning');
                    else if(p === 'Medium') resultBox.classList.add('info');
                    else resultBox.classList.add('success');
                } 
                else if (endpoint === 'predict_resolution_hours') {
                    const h = data.predicted_resolution_hours.toFixed(1);
                    resultBox.textContent = `Est. Resolution Time: ${h} hours`;
                    resultBox.classList.add('info');
                } 
                else {
                    const s = data.predicted_satisfaction_band;
                    resultBox.textContent = `Predicted Satisfaction: ${s}`;
                    if(s === 'High') resultBox.classList.add('success');
                    else if(s === 'Mid') resultBox.classList.add('warning');
                    else resultBox.classList.add('danger');
                }

            } catch (err) {
                console.error(err);
                resultBox.style.display = 'block';
                resultBox.className = 'result-alert danger';
                resultBox.textContent = "Error communicating with API.";
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
